name: Update sentiment dashboard

on:
  schedule:
    # ~4pm US/Eastern on weekdays, after market close. UTC offset shifts with
    # US daylight saving, so this drifts by an hour for part of the year.
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh dashboard data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-finbert-${{ runner.os }}

      - name: Install dependencies
        run: uv sync

      - name: Build dashboard data
        run: uv run news-sentiment-dashboard

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh sentiment dashboard data"
            git push
          fi
